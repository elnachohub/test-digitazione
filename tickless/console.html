<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickless Console</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side">
      <a class="brand" href="index.html" title="Tickless home"><img src="icon.svg" alt="" width="28" height="28"><span>Tickless</span></a>
      <nav id="nav">
        <a href="#/overview" data-v="overview"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</a>
        <a href="#/inbox" data-v="inbox"><svg viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/></svg>Inbox<b class="cnt" id="cnt-inbox"></b></a>
        <a href="#/knowledge" data-v="knowledge"><svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-3a3 3 0 0 0-3 3"/></svg>Knowledge<b class="cnt" id="cnt-gaps"></b></a>
        <a href="#/flows" data-v="flows"><svg viewBox="0 0 24 24"><path d="M6 3v6M6 15v6M18 9v6M6 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 3a3 3 0 1 0 0 6M18 15a3 3 0 1 0 0 6M9 12h6"/></svg>Troubleshooters</a>

        <a href="#/widget" data-v="widget"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Widget &amp; bot</a>
        <a href="#/install" data-v="install"><svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>Install</a>

      <div class="side-foot">
        <a class="btn ghost sm" href="demo.html" target="_blank" rel="noopener">Open demo site ↗</a>
        <span id="mode" class="mode"></span>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <h1 id="title">Overview</h1>
        <div class="top-r">
          <span class="chip" id="ai-chip"></span>
          <label class="me">Signed in as
            <select id="me"></select>
          </label>
          <button class="icon-btn" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="core.js"></script>
  <script src="seed.js"></script>
  <script src="console.js"></script>
</body>
</html>
